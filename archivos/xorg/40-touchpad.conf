# Touchpad estilo Mac: tocar = clic, dos dedos = clic derecho, desplazamiento natural
Section "InputClass"
    Identifier "Touchpad estilo Mac"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "TappingButtonMap" "lrm"
    Option "ClickMethod" "clickfinger"
    Option "NaturalScrolling" "true"
EndSection
